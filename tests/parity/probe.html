<!doctype html>
<html><head><meta charset="utf-8"><title>probe</title>
<style>
  #target { position: fixed; left: 200px; top: 200px; width: 200px; height: 120px; background: #4a7; }
  #anim { width: 10px; height: 10px; background: red; transition: width 2s linear; }
  #kf { width: 10px; height: 10px; animation: grow 2s linear forwards; }
  @keyframes grow { from { width: 10px; } to { width: 210px; } }
</style>
</head><body>
<div id="target">click</div>
<div id="anim"></div>
<div id="kf"></div>
<script>
// Everything here runs in the PAGE's main world. Harness-side evaluate() runs in an
// isolated world and cannot see main-world leaks, so nothing is measured from there.
const tag = new URLSearchParams(location.search).get('tag') || 'untagged';
const R = { tag, t0: performance.now(), errors: {} };
const safe = (k, f) => { try { return f(); } catch (e) { R.errors[k] = String(e); return null; } };

R.activationAtLoad = safe('act0', () => navigator.userActivation &&
  { hasBeenActive: navigator.userActivation.hasBeenActive, isActive: navigator.userActivation.isActive });

// ---- API surface ------------------------------------------------------------------
function surface() {
  const out = new Set();
  const names = Object.getOwnPropertyNames(self);
  for (const n of names) {
    out.add('global:' + n);
    let v;
    try { v = self[n]; } catch (e) { continue; }
    if (typeof v === 'function' && /^[A-Z]/.test(n)) {
      for (const s of Object.getOwnPropertyNames(v)) out.add('static:' + n + '.' + s);
      if (v.prototype) for (const p of Object.getOwnPropertyNames(v.prototype)) out.add('proto:' + n + '.' + p);
    }
  }
  for (const p of Object.getOwnPropertyNames(Object.getPrototypeOf(navigator))) out.add('navproto:' + p);
  const cs = getComputedStyle(document.documentElement);
  for (let i = 0; i < cs.length; i++) out.add('css:' + cs[i]);
  for (const k in document.body.style) out.add('style:' + k);
  const c = document.createElement('canvas');
  out.add('ctx:webgl=' + !!c.getContext('webgl'));
  out.add('ctx:webgl2=' + !!document.createElement('canvas').getContext('webgl2'));
  out.add('ctx:webgpu=' + !!navigator.gpu);
  return [...out].sort();
}
R.surface = safe('surface', surface);

  'video/mp4; codecs="avc1.640028"', 'video/mp4; codecs="avc1.42E01E, mp4a.40.2"', 'video/mp4; codecs="hev1.1.6.L93.B0"',
  'video/mp4; codecs="hvc1.1.6.L93.B0"', 'video/mp4; codecs="av01.0.05M.08"', 'video/mp4; codecs="vp09.00.10.08"',
  'video/mp4; codecs="mp4a.40.2"', 'video/mp4; codecs="flac"', 'video/mp4; codecs="opus"', 'video/mp4; codecs="bogus"',
  'audio/mp4', 'audio/mp4; codecs="mp4a.40.2"', 'audio/mp4; codecs="mp4a.40.5"', 'audio/mp4; codecs="mp4a.40.29"',
  'audio/mp4; codecs="ac-3"', 'audio/mp4; codecs="ec-3"', 'audio/mp4; codecs="opus"', 'audio/mp4; codecs="flac"',
  'audio/aac', 'audio/mpeg', 'audio/mp3', 'audio/ogg', 'audio/ogg; codecs="vorbis"', 'audio/ogg; codecs="opus"',
  'audio/ogg; codecs="flac"', 'audio/wav', 'audio/wav; codecs="1"', 'audio/flac', 'audio/x-m4a', 'audio/webm',
  'audio/webm; codecs="opus"', 'audio/webm; codecs="vorbis"', 'video/webm', 'video/webm; codecs="vp8"',
  'video/webm; codecs="vp8, vorbis"', 'video/webm; codecs="vp9"', 'video/webm; codecs="vp09.00.10.08"',
  'video/webm; codecs="av01.0.05M.08"', 'video/webm; codecs="opus"', 'video/ogg', 'video/ogg; codecs="theora"',
  'video/ogg; codecs="theora, vorbis"', 'video/x-matroska', 'video/x-matroska; codecs="avc1.42E01E"',
  'video/quicktime', 'video/3gpp', 'video/mp2t', 'application/x-mpegURL', 'application/vnd.apple.mpegurl',
  'audio/x-wav', 'audio/3gpp', 'video/x-msvideo', 'video/avi', 'image/avif', 'image/webp', 'image/jxl',

R.codecs = safe('codecs', () => {
  const v = document.createElement('video'), a = document.createElement('audio');
  const o = {};
  for (const t of TYPES) {
    o[t] = {
      video: v.canPlayType(t), audio: a.canPlayType(t),
      mse: self.MediaSource ? MediaSource.isTypeSupported(t) : null,
    };
  }
  return o;
});

async function mediaCaps() {
  if (!navigator.mediaCapabilities) return null;
  const cfgs = {
    h264_1080: { type: 'media-source', video: { contentType: 'video/mp4; codecs="avc1.640028"', width: 1920, height: 1080, bitrate: 5e6, framerate: 30 } },
    hevc_1080: { type: 'media-source', video: { contentType: 'video/mp4; codecs="hev1.1.6.L93.B0"', width: 1920, height: 1080, bitrate: 5e6, framerate: 30 } },
    vp9_1080: { type: 'media-source', video: { contentType: 'video/webm; codecs="vp09.00.10.08"', width: 1920, height: 1080, bitrate: 5e6, framerate: 30 } },
    av1_1080: { type: 'media-source', video: { contentType: 'video/mp4; codecs="av01.0.08M.08"', width: 1920, height: 1080, bitrate: 5e6, framerate: 30 } },
    vp9_4k: { type: 'media-source', video: { contentType: 'video/webm; codecs="vp09.00.51.08"', width: 3840, height: 2160, bitrate: 2e7, framerate: 60 } },
    aac: { type: 'media-source', audio: { contentType: 'audio/mp4; codecs="mp4a.40.2"', channels: 2, bitrate: 128000, samplerate: 44100 } },
    opus: { type: 'media-source', audio: { contentType: 'audio/webm; codecs="opus"', channels: 2, bitrate: 128000, samplerate: 48000 } },
  };
  const o = {};
  for (const [k, c] of Object.entries(cfgs)) {
    try { const r = await navigator.mediaCapabilities.decodingInfo(c); o[k] = { s: r.supported, sm: r.smooth, pe: r.powerEfficient }; }
    catch (e) { o[k] = 'ERR ' + e.name; }
  }
  return o;
}

// ---- Debuggee side effects -------------------------------------------------------------
async function asyncStack() {
  async function inner() { await null; return new Error('x').stack; }
  async function outer() { return await inner(); }
  return await outer();
}
function throwStack() {
  // A thrown non-Error only carries a captured stack in a debuggee realm.
  try { (function thrower() { throw { plain: 1 }; })(); } catch (e) { return Object.keys(e).join(','); }
}

// ---- wasm vs JS ratio (Juggler's debugger used to pin wasm to baseline) ----------------
function wasmRatio() {
  // (func $loop (param i32) (result i32) ... sum 0..n) built by hand
  const bytes = new Uint8Array([0,97,115,109,1,0,0,0,1,6,1,96,1,127,1,127,3,2,1,0,7,8,1,4,108,111,111,112,0,0,
    10,33,1,31,1,2,127,3,64,32,2,32,1,106,32,1,108,33,2,32,1,65,1,106,34,1,32,0,72,13,0,11,32,2,11]);
  let wasmFn;
  try { wasmFn = new WebAssembly.Instance(new WebAssembly.Module(bytes)).exports.loop; }
  catch (e) { return 'module error: ' + e; }
  function jsFn(n) { let s = 0; for (let i = 0; i < n; i = (i + 1) | 0) s = Math.imul(s + i, i); return s; }
  const N = 2e6;
  for (let i = 0; i < 30; i++) { wasmFn(N / 10); jsFn(N / 10); }
  let t = performance.now(); for (let i = 0; i < 20; i++) wasmFn(N); const tw = performance.now() - t;
  t = performance.now(); for (let i = 0; i < 20; i++) jsFn(N); const tj = performance.now() - t;
  return { wasm_ms: +tw.toFixed(1), js_ms: +tj.toFixed(1), ratio: +(tw / tj).toFixed(3) };
}

// ---- Animations (no-css-animations patch makes them instant) -------------------------
function animProbe() {
  return new Promise(res => {
    const el = document.getElementById('anim');
    el.getBoundingClientRect();
    el.style.width = '210px';
    setTimeout(() => {
      res({
        transitionMid: getComputedStyle(el).width,
        keyframeMid: getComputedStyle(document.getElementById('kf')).width,
        animations: document.getAnimations().length,
        reducedMotion: matchMedia('(prefers-reduced-motion: reduce)').matches,
      });
    }, 500);
  });
}

// ---- Geolocation ------------------------------------------------------------------
async function geo() {
  const o = {};
  try { o.permission = (await navigator.permissions.query({ name: 'geolocation' })).state; } catch (e) { o.permission = 'ERR ' + e; }
  o.position = await new Promise(res => {
    const timer = setTimeout(() => res('timeout'), 6000);
    try {
      navigator.geolocation.getCurrentPosition(
        p => { clearTimeout(timer); res({ lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy }); },
        e => { clearTimeout(timer); res('error ' + e.code + ' ' + e.message); },
        { timeout: 5000 });
    } catch (e) { clearTimeout(timer); res('throw ' + e); }
  });
  return o;
}

// ---- Pointer events from the harness's click -------------------------------------
R.pointer = [];
for (const type of ['pointermove', 'pointerdown', 'pointerup', 'click', 'mousedown']) {
  document.getElementById('target').addEventListener(type, e => {
    if (R.pointer.filter(p => p.type === type).length >= 2) return;
    R.pointer.push({ type, pointerType: e.pointerType, isTrusted: e.isTrusted, pointerId: e.pointerId,
      width: e.width, height: e.height, pressure: e.pressure, detail: e.detail, buttons: e.buttons,
      mozInputSource: e.mozInputSource, screenX: e.screenX, clientX: e.clientX });
  });
}

// ---- Misc identity values (differ by claimed OS; recorded, not diffed) -------------
function misc() {
  const n = navigator;
  return {
    ua: n.userAgent, platform: n.platform, oscpu: n.oscpu, appVersion: n.appVersion, buildID: n.buildID,
    webdriver: n.webdriver, hc: n.hardwareConcurrency, langs: n.languages, lang: n.language,
    maxTouch: n.maxTouchPoints, pdf: n.pdfViewerEnabled, cookie: n.cookieEnabled,
    tz: Intl.DateTimeFormat().resolvedOptions().timeZone, tzo: new Date().getTimezoneOffset(),
    screen: [screen.width, screen.height, screen.availWidth, screen.availHeight, screen.colorDepth],
    win: [innerWidth, innerHeight, outerWidth, outerHeight, devicePixelRatio],
    res: ['1dppx', '1.25dppx', '1.5dppx', '2dppx'].filter(r => matchMedia(`(resolution: ${r})`).matches),
    visual: self.visualViewport ? [visualViewport.width, visualViewport.height, visualViewport.scale] : null,
    screenPos: [screenX, screenY, screen.left, screen.top],
    voices: self.speechSynthesis ? speechSynthesis.getVoices().length : null,
    visibility: document.visibilityState, hasFocus: document.hasFocus(),
    errStack: new Error('e').stack.split('\n').length,
    fnToString: Function.prototype.toString.call(navigator.__lookupGetter__ ? Object.getOwnPropertyDescriptor(Navigator.prototype, 'webdriver').get : null),
  };
}

async function main() {
  // A subresource from a non-loopback plain-HTTP origin (the container's own IP, passed
  // by the harness): loopback counts as potentially trustworthy, so br/zstd are allowed
  // there even in stock and only this request shows the plain-HTTP Accept-Encoding.
  const ext = new URLSearchParams(location.search).get('ext');
  if (ext) await fetch(`http://${ext}/blank.html?tag=${encodeURIComponent(tag)}`, { mode: 'no-cors' }).catch(() => {});
  R.misc = safe('misc', misc);
  R.mediaCaps = await mediaCaps().catch(e => 'ERR ' + e);
  R.asyncStack = await asyncStack().catch(e => 'ERR ' + e);
  R.throwStack = safe('throw', throwStack);
  R.wasm = safe('wasm', wasmRatio);
  R.anim = await animProbe();
  R.geo = await geo();
  R.webrtc = await new Promise(res => {
    if (!self.RTCPeerConnection) return res(null);
    const cands = [];
    try {
      const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
      pc.createDataChannel('x');
      pc.onicecandidate = e => { if (e.candidate) cands.push(e.candidate.candidate); else { pc.close(); res({ cands, sdpHasIp: null }); } };
      pc.createOffer().then(o => pc.setLocalDescription(o));
      setTimeout(() => { try { pc.close(); } catch (e) {} res({ cands, timeout: true }); }, 6000);
    } catch (e) { res('ERR ' + e); }
  });
  R.fp = await fp().catch(e => 'ERR ' + e.stack);
  R.webgpu = await (async () => {
    if (!navigator.gpu) return null;
    try {
      const a = await navigator.gpu.requestAdapter();
      if (!a) return 'null adapter';
      const i = a.info || {};
      return { vendor: i.vendor, arch: i.architecture, device: i.device, desc: i.description,
        features: [...a.features].sort(), fallback: a.isFallbackAdapter,
        limits: Object.fromEntries(Object.keys(Object.getPrototypeOf(a.limits)).map(k => [k, a.limits[k]])),
        pref: navigator.gpu.getPreferredCanvasFormat() };
    } catch (e) { return 'ERR ' + e; }
  })();
  // Give the harness time to click the target.
  const deadline = performance.now() + (new URLSearchParams(location.search).has('noclick') ? 2000 : 10000);
  while (performance.now() < deadline && !R.pointer.some(p => p.type === 'click')) await new Promise(r => setTimeout(r, 100));
  R.activationAtEnd = navigator.userActivation &&
    { hasBeenActive: navigator.userActivation.hasBeenActive, isActive: navigator.userActivation.isActive };
  R.elapsed = performance.now() - R.t0;
  await fetch('/result?tag=' + encodeURIComponent(tag), { method: 'POST', body: JSON.stringify(R) });
  document.title = 'done';
}
// Tell the harness where #target is on screen, so real X input can hit it.
safe('pos', () => {
  const r = document.getElementById('target').getBoundingClientRect();
  const x = Math.round(mozInnerScreenX + r.left + r.width / 2), y = Math.round(mozInnerScreenY + r.top + r.height / 2);
  fetch(`/pos?tag=${encodeURIComponent(tag)}&x=${x}&y=${y}`);
});
// Activation must be read before anything the harness does, and without our own input.
setTimeout(main, 1500);
</script>
